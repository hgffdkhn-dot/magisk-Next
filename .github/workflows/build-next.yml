name: magisk-Next Build

# 完整构建：手动触发或推送 v* 标签时运行。
# 与 next-ci.yml 分工：那条只做秒级静态校验，这条产出真正的 APK / 刷入产物。
#
# 与上游 build.yml 的两点差异（都是本分支基线决定的，不是随意改的）：
#   1. 基线来自 release 归档快照，git index 里没有 submodule gitlink，
#      所以 actions/checkout 的 submodules: recursive 无效，必须用
#      scripts/bootstrap-submodules.sh 按 .gitmodules 逐个克隆。
#   2. 构建配置用 .github/next-ci.prop（带 next.* 标识、不含签名占位）。
# 环境搭建（JDK 25 / Python / sccache / ONDK）直接复用上游 composite action，
# 保持与官方 master 一致，上游升级时这里自动跟随。

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        type: choice
        options: [debug, release]
        default: debug
      abi_list:
        description: "ABI 列表（逗号分隔，留空用 .github/next-ci.prop 的默认值）"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build magisk-Next (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 检出源码
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0

      - name: 引导 8 个 native 子模块
        # 归档快照无 gitlink；脚本直连失败时会自动回退到镜像。
        run: ./scripts/bootstrap-submodules.sh --shallow

      - name: 复用上游环境（JDK 25 / Python / sccache / Gradle 缓存 / ONDK）
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: 写入 magisk-Next 构建配置
        env:
          ABI_LIST: ${{ inputs.abi_list }}
        run: |
          cp .github/next-ci.prop config.prop
          if [ -n "$ABI_LIST" ]; then
            sed -i "s|^abiList=.*|abiList=$ABI_LIST|" config.prop
          fi
          echo "--- config.prop ---"
          cat config.prop

      - name: 环境自检
        # 不加 --strict：磁盘 / JDK 属于 WARN 级提示，不应让 CI 无谓失败；
        # 真正的 FAIL（SDK、ONDK、submodule、签名配置不完整）仍会返回非零。
        run: python3 next/preflight.py

      - name: 构建全部产物
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./scripts/next-build.sh --skip-preflight --release --verbose
          else
            ./scripts/next-build.sh --skip-preflight --verbose
          fi

      - name: 校验产物完整性
        run: |
          python3 next/integrity.py verify --dir out
          echo "--- SHA256SUMS ---"
          cat out/SHA256SUMS

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: magisk-Next-${{ github.sha }}
          path: out/
          if-no-files-found: error
          compression-level: 9

      - name: 上传 mapping 与 native 符号
        uses: actions/upload-artifact@v7
        with:
          name: magisk-Next-${{ github.sha }}-symbols
          path: app/apk/build/outputs
          if-no-files-found: warn
          compression-level: 9

      - name: 关闭 Gradle daemon
        if: always()
        run: ./app/gradlew --stop || true

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: magisk-Next-${{ github.sha }}
          path: out

      - name: 创建 Release 并附上产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find out -maxdepth 1 -type f -print)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --generate-notes --repo "$GITHUB_REPOSITORY"
