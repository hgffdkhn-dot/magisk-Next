name: magisk-Next CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 静态校验 / 单测 / 工具自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行仓库校验套件
        run: bash scripts/verify-next.sh
      - name: 校验器 JSON 输出冒烟
        run: python3 next/verify_repo.py --json

  build:
    name: 完整构建（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: 环境自检
        run: python3 next/preflight.py --strict
      - name: 安装 Magisk ONDK
        run: ./build.py ndk
      - name: 构建全部产物
        run: ./scripts/next-build.sh --skip-preflight --release
      - name: 校验产物完整性
        run: python3 next/integrity.py verify --dir out
      - uses: actions/upload-artifact@v4
        with:
          name: magisk-Next
          path: out/
          if-no-files-found: error
