name: magisk-Next CI

# 快速校验：秒级、不需要 Android SDK，每次 push / PR 都跑。
# 完整构建（出 APK / 刷入产物）见 build-next.yml，仅手动触发或推送 v* 标签时运行。

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 静态校验 / 单测 / 工具自测
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 运行仓库校验套件
        run: bash scripts/verify-next.sh
      - name: 校验器 JSON 输出冒烟
        run: python3 next/verify_repo.py --json
      - name: 构建脚本语法与参数入口冒烟（不触发真实构建）
        run: |
          bash -n scripts/next-build.sh
          ./scripts/next-build.sh --help
